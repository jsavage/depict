# GitHub Actions Workflow: Build Depict Using Pre-built Docker Image

name: Build with Docker Image

on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Build identifier (for traceability)"
        required: false
        default: "manual"
        type: string

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  RUSTUP_TOOLCHAIN: nightly-2024-05-01
  DOCKER_IMAGE: ghcr.io/jsavage/depict-builder:ubuntu22.04-nightly-2024-05-01

jobs:
  build-in-container:
    name: Build Using Docker Image
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    container:
      image: ghcr.io/jsavage/depict-builder:ubuntu22.04-nightly-2024-05-01
      credentials:
        username: jsavage
        password: ${{ secrets.GHCR_PAT_READ }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git safe directory
        run: |
          git config --global --add safe.directory /github/workspace

      # This must run before any cargo command. The container currently has
      # rustup but no configured default toolchain.
      - name: Configure Rust nightly toolchain
        shell: bash
        run: |
          set -euxo pipefail

          rustup set auto-self-update disable

          rustup toolchain install nightly-2024-05-01 \
            --profile minimal

          rustup target add wasm32-unknown-unknown \
            --toolchain nightly-2024-05-01

          rustc --version
          cargo --version
          rustup show active-toolchain
          rustup target list --installed

      - name: Apply code fixes
        shell: bash
        run: |
          set -euxo pipefail

          # Allow additional Label fields used by the current dependency/API.
          sed -i \
            's/Label{text, hpos, width, vpos}/Label{text, hpos, width, vpos, ..}/g' \
            server/src/main.rs || true

          # The project requires factorial 0.4.
          sed -i \
            's/factorial = "[^"]*"/factorial = "0.4"/' \
            Cargo.toml || true

          # Allow the server to accept connections from outside the container.
          sed -i \
            's/\[127, 0, 0, 1\]/[0, 0, 0, 0]/g' \
            server/src/main.rs || true

      - name: Validate Cargo configuration
        shell: bash
        run: |
          set -euxo pipefail

          grep -n "inflector" server/Cargo.toml
          grep -n "factorial" Cargo.toml || true

          cargo metadata \
            --format-version 1 \
            --no-deps \
            >/dev/null

      - name: Update dependencies
        shell: bash
        run: |
          set -euxo pipefail
          cargo update

      - name: Build desktop GUI
        shell: bash
        run: |
          set -o pipefail

          echo "::group::Building desktop component"
          echo "Rust toolchain: ${RUSTUP_TOOLCHAIN}"
          cargo build --release -p depict-desktop 2>&1 | tee desktop-build.log
          echo "::endgroup::"

          if [ -f "target/release/depict-desktop" ]; then
            echo "Desktop binary created:"
            du -h target/release/depict-desktop
          else
            echo "Desktop binary not found"
            exit 1
          fi

      - name: Build server
        shell: bash
        run: |
          set -o pipefail

          echo "::group::Building server component"
          cargo build --release -p depict-server 2>&1 | tee server-build.log
          echo "::endgroup::"

          if [ -f "target/release/depict-server" ]; then
            echo "Server binary created:"
            du -h target/release/depict-server
          else
            echo "Server binary not found"
            exit 1
          fi

      - name: Build web WASM
        shell: bash
        run: |
          set -o pipefail

          echo "::group::Building web WASM component"
          cargo build \
            --release \
            -p depict-web \
            --target wasm32-unknown-unknown \
            2>&1 | tee web-build.log
          echo "::endgroup::"

          if [ -f "target/wasm32-unknown-unknown/release/depict_web.wasm" ]; then
            echo "WASM binary created:"
            du -h target/wasm32-unknown-unknown/release/depict_web.wasm
          else
            echo "WASM binary not found"
            exit 1
          fi

      - name: Build web assets with Trunk
        shell: bash
        run: |
          set -o pipefail

          echo "::group::Building web assets"
          cd web
          trunk build --release 2>&1 | tee ../trunk-build.log
          cd ..
          echo "::endgroup::"

          if [ -d "web/dist" ]; then
            echo "Web assets created in web/dist/"
            ls -lh web/dist/
          else
            echo "Web dist directory not found"
            exit 1
          fi

      - name: Organize artifacts
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_ID="${{ github.event.inputs.build_id }}"
          BUILD_DIR="docker-image-build-$(date +%Y%m%d-%H%M%S)-${BUILD_ID}-${{ github.sha }}"

          echo "Creating release directory: ${BUILD_DIR}"
          mkdir -p "${BUILD_DIR}/dist"
          mkdir -p "${BUILD_DIR}/logs"

          cp target/release/depict-desktop "${BUILD_DIR}/dist/"
          cp target/release/depict-server "${BUILD_DIR}/dist/"
          cp -r web/dist/* "${BUILD_DIR}/dist/"

          cp desktop-build.log "${BUILD_DIR}/logs/" 2>/dev/null || true
          cp server-build.log "${BUILD_DIR}/logs/" 2>/dev/null || true
          cp web-build.log "${BUILD_DIR}/logs/" 2>/dev/null || true
          cp trunk-build.log "${BUILD_DIR}/logs/" 2>/dev/null || true

          cat > "${BUILD_DIR}/MANIFEST.txt" << EOF
          Depict Build Manifest - Docker Image Build

          Build Information:
          ------------------
          Build ID:          ${BUILD_ID}
          Build Directory:   ${BUILD_DIR}
          Build Date:        $(date -Iseconds)
          Git Commit:        ${{ github.sha }}
          Git Branch:        ${{ github.ref_name }}
          Workflow Run:      ${{ github.run_id }}
          Docker Image:      ${DOCKER_IMAGE}
          Rust Toolchain:    ${RUSTUP_TOOLCHAIN}

          Build Environment:
          ------------------
          Rust Version:      $(rustc --version)
          Cargo Version:     $(cargo --version)

          Components Built:
          -----------------
          Desktop:           depict-desktop
          Server:            depict-server
          Web WASM:          depict-web
          Web Assets:        HTML, JS, CSS in dist/

          Usage:
          ------
          To run the server:
            WEBROOT=./dist PORT=8000 ./dist/depict-server

          Then access at:
            http://localhost:8000

          Repository:
          -----------
          https://github.com/${{ github.repository }}
          EOF

          cat > "${BUILD_DIR}/run_server.sh" << 'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          SCRIPT_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          echo "Starting depict server..."
          echo "Access at: http://localhost:8000"
          echo "Press Ctrl+C to stop"

          WEBROOT="${SCRIPT_DIR}/dist" \
            PORT=8000 \
            "${SCRIPT_DIR}/dist/depict-server"
          EOF

          chmod +x "${BUILD_DIR}/run_server.sh"

          cat > "${BUILD_DIR}/README.txt" << 'EOF'
          Depict - Built with Docker Image
          =================================

          Quick Start:
          ------------
          1. Run: ./run_server.sh
          2. Open browser: http://localhost:8000

          Components:
          -----------
          - depict-desktop: Native GUI application
          - depict-server:  HTTP server for web interface
          - Web assets:    Browser-based interface

          For more information, see MANIFEST.txt
          EOF

          echo "BUILD_DIR=${BUILD_DIR}" >> "${GITHUB_ENV}"

          echo "Build artifacts organized in: ${BUILD_DIR}"
          ls -lh "${BUILD_DIR}/dist/"

      - name: Create release archive
        shell: bash
        run: |
          set -euxo pipefail

          ARCHIVE_NAME="${BUILD_DIR}.tar.gz"

          tar -czf "${ARCHIVE_NAME}" "${BUILD_DIR}"
          sha256sum "${ARCHIVE_NAME}" > "${ARCHIVE_NAME}.sha256"

          ls -lh "${ARCHIVE_NAME}" "${ARCHIVE_NAME}.sha256"
          cat "${ARCHIVE_NAME}.sha256"

      - name: Upload desktop binary
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-build-desktop-${{ github.sha }}
          path: target/release/depict-desktop
          retention-days: 90
          if-no-files-found: error

      - name: Upload server binary
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-build-server-${{ github.sha }}
          path: target/release/depict-server
          retention-days: 90
          if-no-files-found: error

      - name: Upload web assets
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-build-web-${{ github.sha }}
          path: web/dist/
          retention-days: 90
          if-no-files-found: error

      - name: Upload complete build
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-build-complete-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/
            ${{ env.BUILD_DIR }}.tar.gz
            ${{ env.BUILD_DIR }}.tar.gz.sha256
          retention-days: 90
          if-no-files-found: error

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-image-build-logs-${{ github.sha }}
          path: |
            ${{ env.BUILD_DIR }}/logs/
            desktop-build.log
            server-build.log
            web-build.log
            trunk-build.log
          retention-days: 30
          if-no-files-found: warn

      - name: Generate build summary
        if: always()
        shell: bash
        run: |
          cat >> "${GITHUB_STEP_SUMMARY}" << EOF
          # Build with Docker Image

          ## Build Information

          | Property | Value |
          |----------|-------|
          | Docker Image | \`${DOCKER_IMAGE}\` |
          | Rust Toolchain | \`${RUSTUP_TOOLCHAIN}\` |
          | Build ID | \`${{ github.event.inputs.build_id }}\` |
          | Commit | \`${{ github.sha }}\` |
          | Branch | \`${{ github.ref_name }}\` |
          | Build Time | $(date -Iseconds) |

          ## Artifacts

          - \`docker-image-build-desktop-${{ github.sha }}\`
          - \`docker-image-build-server-${{ github.sha }}\`
          - \`docker-image-build-web-${{ github.sha }}\`
          - \`docker-image-build-complete-${{ github.sha }}\`
          - \`docker-image-build-logs-${{ github.sha }}\`

          ## Workflow Run

          [View workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          EOF

  test-build:
    name: Test Build
    needs: build-in-container
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Download complete build
        if: needs.build-in-container.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: docker-image-build-complete-${{ github.sha }}

      - name: Test binaries exist and are executable
        if: needs.build-in-container.result == 'success'
        shell: bash
        run: |
          set -euxo pipefail

          BUILD_DIR="$(find . -maxdepth 1 -type d -name 'docker-image-build-*' | head -1)"

          if [ -z "${BUILD_DIR}" ]; then
            echo "Build directory not found"
            exit 1
          fi

          echo "Testing build in: ${BUILD_DIR}"

          test -x "${BUILD_DIR}/dist/depict-desktop"
          echo "Desktop binary is executable"

          test -x "${BUILD_DIR}/dist/depict-server"
          echo "Server binary is executable"

          test -f "${BUILD_DIR}/dist/index.html"
          echo "Web assets are present"

          echo "All tests passed."
